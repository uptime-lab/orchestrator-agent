version: 2

project_name: orchestrator-agent

release:
  mode: replace
  # PRERELEASE, always. What CI builds here is UNSIGNED: every device-facing
  # path (install.sh, update_agent, the netboot S99agent) verifies a hardware
  # signature made offline with a YubiKey, so a CI artifact is not a release —
  # it is an input to one. Publishing it as a full release invited exactly the
  # mistake this guards against: an unsigned build sitting where a
  # released one is expected. Promotion happens after signing, by hand, with
  # the key present.
  prerelease: true
  header: |
    **Unsigned CI build — not a release.**

    Devices reject an agent artifact without a matching hardware signature, so
    nothing here is installable as-is. The distributable build is signed
    offline (YubiKey) and published to each install's CDN alongside its `.sig`.
  footer: ""

# Disable changelog generation (no release notes)
changelog:
  disable: true

# Snapshot (make agent/deb-arm) version. Debian versions must start with a
# digit, so strip the tag prefix — both "agent-vX.Y.Z" release tags and the
# plain "vX.Y.Z" used via GORELEASER_CURRENT_TAG for local builds. No
# -snapshot suffix: an install may serve these debs from its CDN as-is and the
# suffix leaks into the agent's self-reported version in the UI.
snapshot:
  version_template: '{{ trimprefix (trimprefix .Tag "agent-") "v" }}'

builds:
  - id: agent
    main: ./cmd/agent
    binary: orchestrator-agent
    goos:
      - linux
    goarch:
      # - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
  # The telemetry-only watcher. A separate binary on purpose:
  # it links no command-execution code, so "cannot manage the node" is a
  # property of the artifact, not a flag.
  - id: watcher
    main: ./cmd/watcher
    binary: orchestrator-watcher
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    builds:
      - agent
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md
  - id: watcher
    builds:
      - watcher
    name_template: "orchestrator-watcher_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md

nfpms:
  - id: default
    builds:
      - agent
    package_name: orchestrator-agent
    file_name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    maintainer: "Uptime Lab Inc."
    homepage: "https://github.com/uptime-lab/orchestrator"
    description: "Uptime Orchestrator agent - node management agent"
    license: "Apache-2.0"
    # nfpm writes `license:` into rpm and apk metadata only; a .deb control
    # file carries it solely through a custom field, which is what the
    # release check reads (`dpkg-deb -f <deb> License`).
    deb:
      fields:
        License: "Apache-2.0"
    formats:
      - deb
    bindir: /usr/bin
    contents:
      # - src: "{{ .ArtifactPath }}"
      #   dst: /usr/bin/orchestrator-agent
      #   file_info:
      #     mode: 0755
      - src: orchestrator-agent.service
        dst: /etc/systemd/system/orchestrator-agent.service
        file_info:
          mode: 0644
      # Licence set (Apache-2.0 4(a) and 4(d); the BSD and MIT notices of the
      # compiled modules): agent/LICENSE, agent/NOTICE (identical to the
      # mirror's) and agent/THIRD-PARTY-NOTICES.md, generated by
      # tools/notices/notices.py from this binary's real dependency set.
      - src: LICENSE
        dst: /usr/share/doc/orchestrator-agent/LICENSE
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/orchestrator-agent/NOTICE
        file_info:
          mode: 0644
      - src: THIRD-PARTY-NOTICES.md
        dst: /usr/share/doc/orchestrator-agent/THIRD-PARTY-NOTICES.md
        file_info:
          mode: 0644
    # scripts:
    #   postinstall: |
    #     #!/bin/sh
    #     systemctl daemon-reload || true
    #     # Create config directory if it doesn't exist
    #     mkdir -p /etc/orchestrator || true
    #     # Don't start automatically - user needs to configure adoption file first
    #     # systemctl enable orchestrator-agent || true
    #   postremove: |
    #     #!/bin/sh
    #     systemctl stop orchestrator-agent || true
    #     systemctl disable orchestrator-agent || true
    #     systemctl daemon-reload || true

  # Telemetry-only watcher package. Conflicts with the full
  # agent: both would authenticate the same node identity. The file name
  # template must NOT use .ProjectName (fixed to orchestrator-agent above) or
  # the two debs would collide.
  - id: watcher
    builds:
      - watcher
    package_name: orchestrator-watcher
    file_name_template: "orchestrator-watcher_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    maintainer: "Uptime Lab Inc."
    homepage: "https://github.com/uptime-lab/orchestrator"
    description: "Uptime Orchestrator watcher - telemetry-only agent (no management, no root)"
    license: "Apache-2.0"
    # nfpm writes `license:` into rpm and apk metadata only; a .deb control
    # file carries it solely through a custom field, which is what the
    # release check reads (`dpkg-deb -f <deb> License`).
    deb:
      fields:
        License: "Apache-2.0"
    formats:
      - deb
    bindir: /usr/bin
    conflicts:
      - orchestrator-agent
      # The pre-rename package (published as 0.6.x): a machine that somehow carries it gets a clean
      # takeover instead of two units fighting over one identity.
      - orchestrator-observer
    replaces:
      - orchestrator-observer
    provides:
      - orchestrator-observer
    contents:
      - src: orchestrator-watcher.service
        dst: /etc/systemd/system/orchestrator-watcher.service
        file_info:
          mode: 0644
      # Licence set (Apache-2.0 4(a) and 4(d); the BSD and MIT notices of the
      # compiled modules): agent/LICENSE, agent/NOTICE (identical to the
      # mirror's) and agent/THIRD-PARTY-NOTICES.md, generated by
      # tools/notices/notices.py from this binary's real dependency set.
      - src: LICENSE
        dst: /usr/share/doc/orchestrator-watcher/LICENSE
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/orchestrator-watcher/NOTICE
        file_info:
          mode: 0644
      - src: THIRD-PARTY-NOTICES.md
        dst: /usr/share/doc/orchestrator-watcher/THIRD-PARTY-NOTICES.md
        file_info:
          mode: 0644
    scripts:
      postinstall: scripts/watcher-postinstall.sh


